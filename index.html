<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIM ZAYN</title>
    <style>
        :root { --neon: #00ff41; --danger: #ff003c; --gold: #ffea00; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; user-select: none; overflow-x: hidden; }
        .header-container { text-align: center; padding: 30px 10px; }
        .zigzag-name { font-size: 38px; font-weight: 900; letter-spacing: 5px; color: #fff; text-transform: uppercase; text-shadow: 2px 2px var(--danger), -2px -2px var(--neon), 0 0 20px var(--neon); animation: glitch 1.5s infinite; }
        @keyframes glitch { 0% { transform: skew(0deg); } 20% { transform: skew(-3deg); text-shadow: 2px 2px var(--neon), -2px -2px var(--danger); } 40% { transform: skew(3deg); } 100% { transform: skew(0deg); } }
        .glass-box { max-width: 400px; margin: 0 auto 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(0,255,65,0.2); border-radius: 25px; padding: 25px; backdrop-filter: blur(15px); text-align: center; }
        input { width: 100%; padding: 15px; background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 12px; color: var(--neon); font-size: 16px; margin: 15px 0; outline: none; text-align: center; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 15px; background: linear-gradient(45deg, var(--neon), #008f11); border: none; border-radius: 12px; color: #000; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; }
        .pred-val { font-size: 55px; font-weight: 900; margin: 10px 0; text-shadow: 0 0 20px var(--neon); }
        .footer-branding { margin-top: 30px; padding: 15px; text-align: center; }
        .name-box { display: inline-block; padding: 10px 30px; border: 1px solid var(--neon); border-radius: 5px; color: var(--neon); font-weight: bold; letter-spacing: 3px; cursor: pointer; background: rgba(0, 255, 65, 0.05); }
        .admin-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 350px; background: #000; border: 2px solid var(--gold); border-radius: 20px; padding: 20px; z-index: 1000; box-sizing: border-box; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 11px; }
        th { color: #888; border-bottom: 1px solid #222; padding: 8px; }
        td { padding: 10px; border-bottom: 1px solid #111; text-align: center; }
        .win { color: var(--neon); font-weight: bold; }
        .loss { color: var(--danger); font-weight: bold; }
        .hidden { display: none; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999; }
        #tgStatus { font-size: 12px; margin-top: 10px; color: var(--gold); }
        
        /* Toggle Switch UI Styling */
        .toggle-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; padding: 8px; background: rgba(255,255,255,0.02); border-radius: 10px; border: 1px solid #222; }
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; margin: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 24px; border: 1px solid #555; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: #fff; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--neon); border-color: var(--neon); }
        input:checked + .slider:before { transform: translateX(22px); background-color: #000; }
        .toggle-label { font-size: 11px; font-weight: bold; letter-spacing: 1px; color: #ccc; }
        #wakeLockStatus { font-size: 10px; color: #666; margin-top: 5px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header-container">
        <div class="zigzag-name">𝐐𝐮𝐢𝐜𝐤𝐓𝐫𝐚𝐝𝐞 𝐏𝐫𝐨</div>
        <div style="color: var(--gold); font-size: 10px; letter-spacing: 4px; margin-top: 5px;">OWNER KIM ZAYN</div>
    </div>

    <!-- Login Screen -->
    <div id="loginPage" class="glass-box">
        <h3 style="margin:0; color:var(--neon); font-size: 14px;">ENTER LICENSE</h3>
        <input type="text" id="keyIn" placeholder="FB-VIP-XXXXX">
        <button class="btn-main" onclick="startSystem()">ACTIVATE</button>
        <p id="err" style="color:var(--danger); font-size: 12px; margin-top: 10px;"></p>
    </div>

    <!-- Main Application Screen -->
    <div id="appPage" class="glass-box hidden">
        <div style="color: #888; font-size: 13px;" id="pID">PERIOD: ---</div>
        <div class="pred-val" id="pRes">WAIT...</div>
        <div style="color: var(--gold); font-size: 13px; font-weight: bold; border:1px dashed var(--gold); padding:8px;" id="pOpps">ANALYZING...</div>
        <div id="tgStatus">Telegram Signal: Idle</div>

        <!-- ON/OFF Toggle Switch for Telegram Signals -->
        <div class="toggle-container">
            <span class="toggle-label">TELEGRAM SIGNAL:</span>
            <label class="switch">
                <input type="checkbox" id="tgToggle" onchange="toggleTgSignals(this.checked)">
                <span class="slider"></span>
            </label>
            <span id="toggleText" style="font-size: 11px; font-weight: bold; color: var(--danger);">OFF</span>
        </div>
        <div id="wakeLockStatus">Keep-Alive: Initializing...</div>

        <table>
            <thead><tr><th>PRD</th><th>PRED</th><th>NUM</th><th>STATUS</th></tr></thead>
            <tbody id="logs"></tbody>
        </table>
        <button onclick="logout()" style="background:transparent; color:#444; border:none; margin-top:15px; font-size:10px; cursor:pointer;">LOGOUT</button>
    </div>

    <!-- VIP Admin Panel Trigger -->
    <div class="footer-branding">
        <div class="name-box" onclick="triggerAdmin()">𝗩𝗜𝗣</div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="overlay" class="overlay hidden" onclick="closeAdmin()"></div>
    <div id="adminPanel" class="admin-modal hidden">
        <h3 style="color: var(--gold); text-align: center; margin-top:0;">MASTER CONTROL</h3>
        <select id="keyValidity" style="width: 100%; padding: 12px; background: #111; color: #fff; border: 1px solid #444; border-radius: 8px;">
            <option value="30">30 MINUTES</option>
            <option value="1440">1 DAY</option>
            <option value="10080">7 DAYS</option>
            <option value="43200">30 DAYS</option>
        </select>
        <button class="btn-main" style="background: var(--gold); color: #000; margin-top: 15px;" onclick="genKey()">GENERATE KEY</button>
        <div id="outKey" style="margin-top: 15px; color: var(--neon); font-size: 11px; word-break: break-all;"></div>
    </div>

<script>
    // Telegram Credentials
    const BOT_TOKEN = "8710564812:AAHa-mvOARZAzgazLXrQJ3Mb7lUdv7jhmzw";
    const CHAT_ID = "-1002405851284";

    // Normal Win Sticker (Emoji: 🍟)
    const STICKER_WIN = "CAACAgUAAxkBAAEvQj9qu3XUcpHvEh6iT8MKWQmNXghdiQAC6xoAAmMZ8FT9FfvAUGKA1D0E";

    // Number Hit / Jackpot Sticker (Emoji: 🚫)
    const STICKER_JACKPOT = "CAACAgUAAxkBAAEvQlFqu3fXYOKwfdWUs0Ua-PWGp_Hr1QACTxsAAp5t-FQ3vR1DIKvkvj0E";

    const ADMIN_PASS = "Fab009";
    const B_POOL = [5,6,7,8,9], S_POOL = [0,1,2,3,4];
    let currentOpposites = [];

    // Global Telegram Control Variable
    let isTelegramActive = false;

    // --- SCREEN WAKE LOCK & BACKGROUND AUDIO KEEP-ALIVE ---
    let wakeLock = null;

    async function enableWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                document.getElementById('wakeLockStatus').innerText = "Keep-Alive: Screen Wake Lock Active";
                document.getElementById('wakeLockStatus').style.color = "var(--neon)";
            } else {
                document.getElementById('wakeLockStatus').innerText = "Keep-Alive: Audio Mode Active";
            }
        } catch (err) {
            document.getElementById('wakeLockStatus').innerText = "Keep-Alive: Active";
        }
    }

    // Play silent audio loop to prevent browser freeze in background
    function enableSilentAudioKeepAlive() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.value = 200; // Almost inaudible frequency
            gainNode.gain.value = 0.0001; // Silent volume
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        } catch(e) {}
    }

    // Re-enable Wake Lock if tab becomes visible again
    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await enableWakeLock();
        }
    });

    // Load Toggle state from LocalStorage
    function initTgToggle() {
        const savedState = localStorage.getItem('TG_SIGNAL_ACTIVE');
        const tgToggle = document.getElementById('tgToggle');
        const toggleText = document.getElementById('toggleText');

        if(savedState === 'true') {
            isTelegramActive = true;
            if(tgToggle) tgToggle.checked = true;
            if(toggleText) {
                toggleText.innerText = "ON";
                toggleText.style.color = "var(--neon)";
            }
        } else {
            isTelegramActive = false;
            if(tgToggle) tgToggle.checked = false;
            if(toggleText) {
                toggleText.innerText = "OFF";
                toggleText.style.color = "var(--danger)";
            }
        }
    }

    function toggleTgSignals(checked) {
        isTelegramActive = checked;
        localStorage.setItem('TG_SIGNAL_ACTIVE', checked);
        const toggleText = document.getElementById('toggleText');
        const tgStatus = document.getElementById('tgStatus');
        
        if(checked) {
            toggleText.innerText = "ON";
            toggleText.style.color = "var(--neon)";
            tgStatus.innerText = "Telegram Signal: Active (ON)";
            tgStatus.style.color = "var(--neon)";
        } else {
            toggleText.innerText = "OFF";
            toggleText.style.color = "var(--danger)";
            tgStatus.innerText = "Telegram Signal: Disabled (OFF)";
            tgStatus.style.color = "#888";
        }
    }

    // Telegram Signal Sender
    async function sendTelegramPrediction(period, prediction, opposites) {
        if(!isTelegramActive) return; // Skip sending if OFF

        const oppsStr = opposites.join(",");
        const textMessage = 
`𝐐𝐮𝐢𝐜𝐤𝐓𝐫𝐚𝐝𝐞 𝐏𝐫𝐨 𝐁 𝐓 𝐑

✅ ${period}   ➥  ${prediction}   ${oppsStr}

 Join ➔ @KIM_ZAYNBOSS 💎`;

        try {
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: textMessage
                })
            });
            const data = await res.json();
            if(data.ok) {
                document.getElementById('tgStatus').innerText = `Telegram Signal Sent (${period})`;
                document.getElementById('tgStatus').style.color = '#00ff41';
            } else {
                document.getElementById('tgStatus').innerText = `TG Error: ${data.description}`;
                document.getElementById('tgStatus').style.color = '#ff003c';
            }
        } catch(e) {
            document.getElementById('tgStatus').innerText = "TG Connection Error";
            document.getElementById('tgStatus').style.color = '#ff003c';
        }
    }

    // Telegram Sticker Sender
    async function sendTelegramSticker(stickerId) {
        if(!isTelegramActive || !stickerId) return; // Skip sending if OFF
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendSticker`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    sticker: stickerId
                })
            });
        } catch(e) {
            console.error("Sticker Send Error:", e);
        }
    }

    function validateKeyFormat(key) {
        if(!key.startsWith("FB-VIP-") && !key.startsWith("SR-VIP-")) return false;
        try {
            const parts = key.split("-");
            const expiry = parseInt(atob(parts[3]));
            return expiry > Date.now();
        } catch(e) { return false; }
    }

    window.onload = () => {
        initTgToggle();
        const savedKey = localStorage.getItem('FB_ACTIVE_KEY') || localStorage.getItem('SR_ACTIVE_KEY');
        if(savedKey && validateKeyFormat(savedKey)) {
            document.getElementById('keyIn').value = savedKey;
            startSystem();
        }
    };

    function startSystem() {
        const key = document.getElementById('keyIn').value.trim();
        if(validateKeyFormat(key)) {
            localStorage.setItem('FB_ACTIVE_KEY', key);
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('appPage').classList.remove('hidden');
            
            // Enable Keep-Alive mechanisms on activation
            enableWakeLock();
            enableSilentAudioKeepAlive();
            
            initTgToggle();
            runLogic();
        } else { document.getElementById('err').innerText = "INVALID KEY!"; }
    }

    async function fetchAndProcessPrediction() {
        try {
            const res = await fetch('https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json');
            const json = await res.json();
            const latest = json.data.list[0];

            const last5 = json.data.list.slice(0, 5).map(x => parseInt(x.number) >= 5 ? "BIG" : "SMALL");
            const nextPred = last5.filter(x => x === "BIG").length > 2 ? "BIG" : "SMALL";

            if(window.lastId !== latest.issueNumber) {
                const actualNum = parseInt(latest.number);
                const actualSize = actualNum >= 5 ? "BIG" : "SMALL";
                let lastPred = window.savedPrediction || nextPred;
                let lastOpps = window.savedOpps || [];

                if(window.lastId) {
                    const isSizeWin = (lastPred === actualSize);
                    const isNumberWin = lastOpps.includes(actualNum); // Number Hit / Jackpot
                    const isWin = isSizeWin || isNumberWin;

                    const statusText = isWin ? 'WIN 💀' : 'LOSS 🖤';
                    const row = `<tr><td>${latest.issueNumber.slice(-3)}</td><td>${lastPred}</td><td>${actualNum}</td><td class="${isWin?'win':'loss'}">${statusText}</td></tr>`;
                    document.getElementById('logs').innerHTML = row + document.getElementById('logs').innerHTML;

                    // Automatic Sticker Trigger Logic
                    if (isNumberWin) {
                        await sendTelegramSticker(STICKER_JACKPOT);
                    } else if (isSizeWin) {
                        await sendTelegramSticker(STICKER_WIN);
                    }
                }

                window.lastId = latest.issueNumber;
                window.savedPrediction = nextPred;
                
                const pool = nextPred === "BIG" ? S_POOL : B_POOL;
                currentOpposites = pool.sort(() => 0.5 - Math.random()).slice(0, 2);
                window.savedOpps = currentOpposites;

                const nextPeriodNum = (BigInt(latest.issueNumber) + 1n).toString().slice(-3);

                // Send Telegram Signal
                sendTelegramPrediction(nextPeriodNum, nextPred, currentOpposites);
            }

            document.getElementById('pID').innerText = "PERIOD: " + (BigInt(latest.issueNumber) + 1n).toString();
            document.getElementById('pRes').innerText = nextPred;
            document.getElementById('pOpps').innerText = "OPPOSITE NUMS: " + currentOpposites.join(", ");
        } catch(e) {}
    }

    async function runLogic() {
        // Web Worker to keep timer running even when tab is blurred/backgrounded
        const workerBlob = new Blob([`
            setInterval(() => {
                postMessage('tick');
            }, 3000);
        `], { type: 'application/javascript' });

        const worker = new Worker(URL.createObjectURL(workerBlob));
        worker.onmessage = function() {
            fetchAndProcessPrediction();
        };

        // Initial Execution
        fetchAndProcessPrediction();
    }

    function triggerAdmin() {
        if(prompt("PASSWORD:") === ADMIN_PASS) {
            document.getElementById('adminPanel').classList.remove('hidden');
            document.getElementById('overlay').classList.remove('hidden');
        }
    }

    function genKey() {
        const mins = document.getElementById('keyValidity').value;
        const expiryTime = Date.now() + (mins * 60 * 1000);
        const randomStr = Math.random().toString(36).substr(2, 5).toUpperCase();
        const newKey = `FB-VIP-${randomStr}-${btoa(expiryTime.toString())}`;
        document.getElementById('outKey').innerText = "KEY: " + newKey;
        navigator.clipboard.writeText(newKey).then(() => alert("KEY COPIED!"));
    }

    function logout() { 
        localStorage.removeItem('FB_ACTIVE_KEY'); 
        localStorage.removeItem('SR_ACTIVE_KEY'); 
        location.reload(); 
    }
    
    function closeAdmin() { 
        document.getElementById('adminPanel').classList.add('hidden'); 
        document.getElementById('overlay').classList.add('hidden'); 
    }
</script>
</body>
</html>
